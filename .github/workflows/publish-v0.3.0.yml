name: Publish v0.3.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ac7effbb6fb6cf92d396524398b6e1887a6190ab
      RELEASE_TAG: v0.3.0
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify manifest version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')"
          test "$RELEASE_TAG" = "v$version"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Self-check
        run: python3 scripts/self_check.py

      - name: Build twice
        run: |
          python3 scripts/build_release.py --out-dir dist-a
          python3 scripts/build_release.py --out-dir dist-b

      - name: Verify deterministic package
        shell: bash
        run: |
          set -euo pipefail
          a=(dist-a/chatgpt-codex-plugin-autopilot-*.zip)
          b=(dist-b/chatgpt-codex-plugin-autopilot-*.zip)
          test ${#a[@]} -eq 1
          test ${#b[@]} -eq 1
          cmp -- "${a[0]}" "${b[0]}"
          cmp -- dist-a/SHA256SUMS dist-b/SHA256SUMS
          (cd dist-a && sha256sum -c SHA256SUMS)
          unzip -t "${a[0]}"

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            existing="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$existing" = "$TARGET_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist-a/chatgpt-codex-plugin-autopilot-*.zip \
            dist-a/SHA256SUMS \
            submission/reviewer-packet.json \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
